name: Build and Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build and Package
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive_name: loa-linux-amd64.tar.gz
          - goos: linux
            goarch: arm64
            archive_name: loa-linux-arm64.tar.gz

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.0" # Match the Dockerfile/setup version

      - name: Install Cross-Compiler for ARM64
        if: matrix.goarch == 'arm64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build Loa Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: ${{ matrix.goarch == 'arm64' && 'aarch64-linux-gnu-gcc' || 'gcc' }}
          CXX: ${{ matrix.goarch == 'arm64' && 'aarch64-linux-gnu-g++' || 'g++' }}
        run: |
          LLAMA_GO_VER=$(go list -m -f '{{.Version}}' github.com/tcpipuk/llama-go)
          if [ -n "$LLAMA_GO_VER" ]; then
            TMP_LLAMA_DIR=$(mktemp -d)
            LLAMA_GO_COMMIT=$(echo "$LLAMA_GO_VER" | awk -F'-' '{print $NF}')
            git clone https://github.com/tcpipuk/llama-go.git "$TMP_LLAMA_DIR"
            (
              cd "$TMP_LLAMA_DIR"
              git checkout "$LLAMA_GO_COMMIT"
              git submodule update --init --recursive
              sed -i 's/-march=native -mtune=native//g' Makefile
              sed -i 's/-mcpu=native//g' Makefile
              if [ "${{ matrix.goarch }}" = "arm64" ]; then
                sed -i 's/cmake \.\.\/llama\.cpp/cmake ..\/llama.cpp -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64 -DGGML_NATIVE=OFF/g' Makefile
              else
                sed -i 's/cmake \.\.\/llama\.cpp/cmake ..\/llama.cpp -DGGML_NATIVE=OFF -DGGML_AVX512=OFF/g' Makefile
              fi
              make libbinding.a
            )
            export C_INCLUDE_PATH="$TMP_LLAMA_DIR"
            export LIBRARY_PATH="$TMP_LLAMA_DIR"
            go mod edit -replace github.com/tcpipuk/llama-go="$TMP_LLAMA_DIR"
          fi
          go build -tags localembed -o loa ./cmd/loa

      - name: Create Release Bundle
        run: |
          mkdir -p package/sandbox
          
          # Move binary to package
          mv loa package/
          
          # Copy sandbox configuration
          cp -r sandbox/* package/sandbox/
          
          # Compress everything into the final tar.gz archive
          cd package
          tar -czvf ../${{ matrix.archive_name }} .

      - name: Upload Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} ./${{ matrix.archive_name }} --clobber
